<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CPA 备考助手</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
 body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;}
 .appbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;
  padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.35);}
 .appbar .back{font-size:22px;cursor:pointer;line-height:1;min-width:28px;}
 .appbar .title{font-size:17px;font-weight:800;line-height:1.3;}
 .appbar .crumb{font-size:12px;opacity:.85;margin-top:2px;}
 .screen{display:none;padding:16px;animation:fade .25s ease;}
 .screen.active{display:block;}
 @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 .legend{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
 .legend b{font-size:10px;font-weight:700;padding:1px 8px;border-radius:20px;color:#fff;}
 .l-must{background:#c0392b;} .l-imp{background:#e67e22;} .l-know{background:#16a085;}
 /* 科目卡 */
 .subject{background:#1e293b;border:1px solid #283548;border-radius:16px;padding:18px;margin-bottom:14px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .1s;position:relative;overflow:hidden;}
 .subject:active{transform:scale(.985);}
 .subject .sico{font-size:26px;}
 .subject h2{font-size:18px;font-weight:800;color:#fff;margin:6px 0 3px;}
 .subject .sdesc{font-size:12px;color:#94a3b8;}
 .subject .sbadge{position:absolute;top:12px;right:12px;font-size:10px;background:var(--c,#7c3aed);color:#fff;padding:2px 8px;border-radius:20px;font-weight:700;}
 /* 章节卡 */
 .chapter{background:#1e293b;border:1px solid #283548;border-radius:14px;padding:15px 16px;margin-bottom:12px;cursor:pointer;}
 .chapter:active{transform:scale(.985);}
 .chapter .ct{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:#fff;}
 .chapter .ct .num{background:var(--c,#7c3aed);color:#fff;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
 .chapter .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
 .chapter .meta span{font-size:10px;background:#334155;color:#cbd5e1;padding:2px 8px;border-radius:20px;}
 .chapter .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
 .chapter .tags i{font-style:normal;font-size:10px;padding:1px 8px;border-radius:5px;font-weight:700;}
 .tg-must{background:#c0392b;color:#fff;} .tg-imp{background:#e67e22;color:#fff;} .tg-know{background:#16a085;color:#fff;}
 /* 内容：分组+卡片 */
 .group-head{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-weight:800;font-size:13.5px;
  padding:11px 12px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35);letter-spacing:.5px;cursor:pointer;
  -webkit-user-select:none;user-select:none;display:flex;justify-content:space-between;align-items:center;}
 .group-head .arrow{font-size:11px;transition:transform .2s;opacity:.9;}
 .group-head .gt{display:flex;align-items:center;gap:6px;min-width:0;flex:1;}
 .group-head .gb{font-size:10px;padding:1px 7px;border-radius:20px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:0;}
 .group-head .gb-must{background:#e11d48;box-shadow:0 0 0 2px rgba(225,29,72,.35);}
 .group-head .gb-imp{background:#f59e0b;}
 .col{margin-bottom:12px;}
 .col.collapsed .group-head .arrow{transform:rotate(-90deg);}
 .col.collapsed .gc{display:none;}
 .card{background:#1e293b;border-radius:14px;padding:11px 12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:1px solid #283548;overflow:hidden;cursor:pointer;}
 .card.must{border-left:4px solid #c0392b;--c:#c0392b;}
 .card.imp{border-left:4px solid #eab308;--c:#eab308;}
 .card.know{border-left:4px solid #64748b;--c:#64748b;}
 .card .tt{display:flex;align-items:flex-start;gap:6px;font-weight:800;font-size:12.5px;color:#f1f5f9;line-height:1.4;}
 .card .lv{flex-shrink:0;font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;color:#fff;margin-top:1px;}
 .lv.must{background:#c0392b;} .lv.imp{background:#e67e22;} .lv.know{background:#16a085;}
 .card .em{margin-left:auto;font-size:12px;flex-shrink:0;}
 .card ul{list-style:none;margin-top:7px;}
 .card li{font-size:11.5px;line-height:1.6;color:#a8b6c8;padding:3px 0 3px 13px;position:relative;background:none;}
 .card li::before{content:"▸";position:absolute;left:0;color:var(--c);font-size:9px;top:4px;}
 .card li b{color:#dbe4ef;font-weight:600;}
 .card li .sub{display:block;padding-left:10px;color:#7d8ea3;font-size:10.8px;}
 .card li .sub::before{content:"· ";}
 .card .kj{margin-top:7px;background:rgba(201,162,39,.12);border:1px dashed rgba(201,162,39,.5);border-radius:8px;padding:5px 9px;font-size:11px;color:#e6c96a;font-weight:600;line-height:1.55;}
 .card .kj::before{content:"🔑 ";}
 .card .note{margin-top:7px;background:rgba(29,78,216,.14);border-left:3px solid #3b82f6;border-radius:8px;padding:5px 9px;font-size:11px;color:#8db8ef;font-weight:600;line-height:1.55;}
 .card .note::before{content:"👩‍🏫 老师强调: ";color:#60a5fa;}
 /* 弹窗 */
 #emask{display:none;position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:1000;backdrop-filter:blur(2px);}
 #emask.show{display:block;}
 #emodal{display:none;position:fixed;z-index:1001;left:50%;top:52%;transform:translate(-50%,-50%);
  width:88%;max-width:400px;max-height:82vh;overflow-y:auto;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;}
 #emodal.show{display:block;}
 #emodal h3{font-size:13.5px;color:#fff;margin-bottom:9px;line-height:1.5;padding-right:20px;}
 #emodal .etype{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:5px;background:#4c1d95;color:#e9d5ff;margin-right:6px;}
 #emodal .q{color:#e2e8f0;font-size:12.5px;line-height:1.6;margin:9px 0;}
 #emodal .opt{font-size:12px;color:#cbd5e1;padding:4px 0;line-height:1.5;}
 #emodal .kj{background:rgba(201,162,39,.12);border:1px dashed rgba(201,162,39,.5);border-radius:8px;padding:7px 11px;margin:9px 0;font-size:12.5px;color:#e6c96a;font-weight:600;}
 #emodal .kj::before{content:"🔑 ";}
 #emodal .note{background:rgba(29,78,216,.1);border-left:4px solid #3b82f6;border-radius:8px;padding:7px 11px;margin:9px 0;font-size:12px;color:#93c5fd;font-weight:600;line-height:1.55;}
 #ansbtn{width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-weight:700;font-size:13px;cursor:pointer;margin-top:6px;}
 #ansbox{display:none;background:rgba(34,197,94,.08);border-left:4px solid #16a34a;border-radius:8px;padding:8px 11px;margin-top:9px;}
 #ansbox.show{display:block;}
 #ansbox .at{color:#4ade80;font-weight:800;font-size:12.5px;}
 #ansbox .ax{color:#a7f3d0;font-size:11.5px;line-height:1.6;margin-top:4px;}
 #ec{position:absolute;top:6px;right:12px;font-size:20px;color:#64748b;cursor:pointer;line-height:1;}
 .hint{color:#64748b;font-size:11px;text-align:center;padding:14px 0 6px;}
 .empty{background:#1e293b;border:1px dashed #334155;border-radius:14px;padding:28px;text-align:center;color:#64748b;font-size:13px;}
</style>
</head>

const LVLBL={must:"必会·核心",imp:"重要",know:"了解"};
/* 章节tag汇总：统计 groups 中各等级数量 */
function chapterTags(grp){
  let must=0,imp=0,know=0;
  grp.forEach(g=>g.cards.forEach(c=>{if(c.lv==='must')must++;else if(c.lv==='imp')imp++;else know++;}));
  let tags=[];
  if(must)tags.push({c:'tg-must',t:'必会 '+must});
  if(imp)tags.push({c:'tg-imp',t:'重要 '+imp});
  if(know)tags.push({c:'tg-know',t:'了解 '+know});
  return tags;
}
/* 分组徽章 */
function gbOf(g){
  const hasMust=g.cards.some(c=>c.lv==='must');
  const hasImp=g.cards.some(c=>c.lv==='imp');
  if(hasMust)return '<span class="gb gb-must">含必考</span>';
  if(hasImp)return '<span class="gb gb-imp">含重要</span>';
  return '';
}

let stack=[];

function setBar(t,crumb){$('barTitle').textContent=t;$('barCrumb').textContent=crumb||'';}
function show(id){['s-subject','s-chapter','s-content'].forEach(x=>$(x).classList.toggle('active',x===id));}
function goBack(){
  if(stack.length===1){stack=[];setBar('CPA 备考助手','');show('s-subject');return;}
  if(stack.length===2){stack.pop();renderSubject();return;}
  stack.pop();renderSubject();
}

function renderSubject(){
  let html='';
  Object.keys(DATA).forEach(k=>{
    const s=DATA[k]; const n=s.chapters.length;
    html+=`<div class="subject" data-k="${k}"><span class="sbadge" style="--c:${s.color}">${n}章</span>
      <div class="sico">${s.icon}</div><h2>${s.name}</h2><div class="sdesc">${s.desc||''}</div></div>`;
  });
  $('s-subject').innerHTML=html;
  $('s-subject').querySelectorAll('.subject').forEach(el=>el.onclick=()=>{stack.push(el.dataset.k);renderChapter(el.dataset.k);});
}

    const tags=chapterTags(ch.groups).map(t=>`<i class="${t.c}">${t.t}</i>`).join('');
    html+=`<div class="chapter" data-ch="${i}">
      <div class="ct"><span class="num" style="--c:${s.color}">${i+1}</span>${ch.name}</div>
      <div class="meta"><span>${ch.score||''}</span><span>${ch.types||''}</span></div>
      <div class="tags">${tags}</div></div>`;
  });
  if(!s.chapters.length)html=`<div class="empty">本科目章节整理中…</div>`;
  $('s-chapter').innerHTML=html;
  $('s-chapter').querySelectorAll('.chapter').forEach(el=>el.onclick=()=>openContent(k,+el.dataset.ch));
  show('s-chapter');
}
/* 内容层：分组卡片 */
function openContent(k,ci){
  const s=DATA[k], ch=s.chapters[ci];
  cur={groups:ch.groups, exam:ch.exam, name:ch.name, color:s.color};
  setBar(s.name+' · '+ch.name,'');
  let html='';
  ch.groups.forEach(g=>{
    html+=`<div class="col"><div class="group-head" style="--g:${g.g};--g2:${g.g2}"><span class="gt">${g.name}${gbOf(g)}</span><span class="arrow">▾</span></div><div class="gc">`;
    g.cards.forEach(c=>{
      html+=`<div class="card c-${c.lv} ${c.lv}" data-id="${c.id}">
        <div class="tt"><span class="lv ${c.lv}">${LVLBL[c.lv]}</span>${c.t}${c.exam?'<span class="em">📝</span>':''}</div><ul>`;
      (c.subs||[]).forEach(sb=>{
        html+=`<li><b>${sb.t}</b>${sb.ex?' <span style="color:#64748b">· '+sb.ex+'</span>':''}`;
        if(sb.kids)sb.kids.forEach(kk=>html+=`<span class="sub">${kk}</span>`);
        html+=`</li>`;
      });
      html+=`</ul>`;
      if(c.kj)html+=`<div class="kj">${c.kj}</div>`;
      if(c.note)html+=`<div class="note">${c.note}</div>`;
      html+=`</div>`;
    });
    html+=`</div></div>`;
  });
  $('s-content').innerHTML=html;
  $('s-content').querySelectorAll('.group-head').forEach(gh=>gh.onclick=()=>gh.parentElement.classList.toggle('collapsed'));
  $('s-content').querySelectorAll('.card').forEach(el=>el.onclick=()=>openCard(+el.dataset.id));
  show('s-content');
}
function openCard(id){
  let c=null;
  cur.groups.forEach(g=>{const f=g.cards.find(x=>x.id===id);if(f)c=f;});
  if(!c)return;
  const e=cur.exam&&c.exam?cur.exam[c.exam]:null;
  let h='';
  if(e){
    h+=`<span class="etype">${e.t}</span><h3>${c.t}</h3><div class="q">${e.w}</div>`;
    e.q.forEach(o=>h+=`<div class="opt">${o}</div>`);
    if(c.kj)h+=`<div class="kj">${c.kj}</div>`;
    if(c.note)h+=`<div class="note">${c.note}</div>`;
    h+=`<button id="ansbtn">查看答案和解析</button><div id="ansbox"><div class="at">答案：${e.a}</div><div class="ax">${e.s}</div></div>`;
  }else{
    h+=`<span class="etype">要点</span><h3>${c.t}</h3>`;
    (c.subs||[]).forEach(sb=>{
      h+=`<div class="q"><b>${sb.t}</b>${sb.ex?' <span style="color:#64748b">· '+sb.ex+'</span>':''}</div>`;
      if(sb.kids)sb.kids.forEach(kk=>h+=`<div class="q" style="padding-left:9px;border-left:2px solid #334155;margin-left:6px">· ${kk}</div>`);
    });
  }
  $('eb').innerHTML=h;
  $('emask').classList.add('show');$('emodal').classList.add('show');
  const btn=document.getElementById('ansbtn');
  if(btn)btn.onclick=()=>{$('ansbox').classList.add('show');btn.style.display='none';};
}
$('ec').onclick=()=>{$('emask').classList.remove('show');$('emodal').classList.remove('show');};
$('emask').onclick=()=>{$('emask').classList.remove('show');$('emodal').classList.remove('show');};
$('backBtn').onclick=goBack;
renderSubject();
show('s-subject');
</script>
