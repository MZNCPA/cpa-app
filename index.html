<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CPA 备考助手</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1a1a2e;min-height:100vh;}
  /* 顶部 */
  .appbar{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;padding:16px 18px 14px;
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(124,58,237,.3);}
  .appbar .back{font-size:22px;cursor:pointer;line-height:1;min-width:28px;}
  .appbar .title{font-size:17px;font-weight:700;line-height:1.3;}
  .appbar .crumb{font-size:12px;opacity:.85;margin-top:2px;}
  /* 主体 */
  .screen{display:none;padding:16px;animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* 科目卡片 */
  .subject{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;cursor:pointer;
    box-shadow:0 1px 6px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;
    border:2px solid transparent;transition:.2s;}
  .subject:active{border-color:#7c3aed;transform:scale(.98);}
  .subject .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;flex-shrink:0;}
  .subject .nm{font-size:17px;font-weight:700;}
  .subject .des{font-size:12.5px;color:#6b7280;margin-top:3px;}
  .subject .arrow{margin-left:auto;color:#c4c4c4;font-size:20px;}
  /* 章节列表 */
  .sec-head{font-size:13px;color:#7c3aed;font-weight:700;margin:14px 0 8px;padding-left:4px;}
  .chapter{background:#fff;border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.05);border:2px solid transparent;transition:.2s;}
  .chapter:active{border-color:#7c3aed;transform:scale(.98);}
  .chapter .nm{font-size:15px;font-weight:700;color:#2c3e50;}
  .chapter .meta{font-size:12px;color:#9ca3af;margin-top:3px;}
  .chips{margin-top:8px;}
  .chip{display:inline-block;font-size:11px;background:#f3effd;color:#6d28d9;border-radius:20px;padding:3px 9px;margin:2px 3px 0 0;}
  .chip.must{background:#fdecea;color:#c0392b;}
  .chapter .arrow{margin-left:auto;color:#c4c4c4;font-size:20px;text-align:right;}
  /* 内容屏（思维导图式折叠） */
  .content-wrap{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 6px rgba(0,0,0,.05);}
  .c-title{font-size:15px;font-weight:700;color:#7c3aed;margin-bottom:10px;padding:8px 6px;border-bottom:2px solid #f3effd;}
  details.sub{background:#eef3fb;border-radius:10px;margin:8px 0;overflow:hidden;}
  details.sub>summary{cursor:pointer;padding:12px 14px;font-weight:700;color:#7c3aed;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;}
  details.sub>summary::before{content:"▸";font-size:12px;transition:.15s;color:#7c3aed;flex-shrink:0;}
  details.sub[open]>summary::before{content:"▾";}
  details.sub>summary:hover{background:#e2eafa;}
  .star-ico{color:#e11d48;}
  .lv{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:auto;flex-shrink:0;}
  .lv.must{background:#c0392b;color:#fff;}
  .lv.imp{background:#c9a227;color:#fff;}
  .lv.know{background:#7c8aa0;color:#fff;}
  .sub-inner{padding:2px 14px 12px;background:#fff;}
  .sub-inner ul{list-style:none;padding-left:4px;}
  .sub-inner li{padding:3px 0 3px 16px;font-size:13.5px;position:relative;color:#374151;}
  .sub-inner li::before{content:"•";color:#7c3aed;position:absolute;left:2px;font-weight:700;}
  .kw{color:#7c3aed;font-weight:600;}
  .teach{background:#fdf6e3;border-left:3px solid #eab308;border-radius:6px;padding:9px 11px;margin:8px 0;font-size:13.5px;}
  .teach::before{content:"📌 老师强调 ";font-weight:700;color:#b8860b;}
  .q{background:#e9f7ef;border-left:3px solid #1e8449;border-radius:6px;padding:9px 11px;margin:8px 0;font-size:13px;}
  .q .ans{font-weight:700;color:#1e8449;}
  .warn{background:#fdecea;border-left:3px solid #c0392b;border-radius:6px;padding:9px 11px;margin:8px 0;font-size:13px;}
  .warn::before{content:"⚠️ 易错 ";font-weight:700;color:#c0392b;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0;}
  th,td{border:1px solid #e5e9f2;padding:7px 8px;text-align:left;}
  th{background:#f3effd;color:#6d28d9;}
  .empty{text-align:center;color:#9ca3af;padding:50px 20px;font-size:14px;}
  .empty .big{font-size:44px;margin-bottom:10px;}
  .switch{margin-top:16px;text-align:center;font-size:12px;color:#9ca3af;}
</style>
</head>

/* ================= 导航逻辑 ================= */
let stack = [];
const screens = {subject:'screen-subject', chapter:'screen-chapter', content:'screen-content'};
const backBtn = document.getElementById('backBtn');
const appTitle = document.getElementById('appTitle');

function showScreen(key){
  Object.values(screens).forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(screens[key]).classList.add('active');
}
function setBar(title, showBack){
  appTitle.innerHTML = title;
  backBtn.style.visibility = showBack ? 'visible':'hidden';
}

function openSubject(key){
  const s = DATA[key];
  if(!s) return;
  if(!s.chapters || s.chapters.length===0){
    stack = ['subject'];
    setBar(s.name, true);
    document.getElementById('chapterList').innerHTML =
      `<div class="empty"><div class="big">📭</div><div>「${s.name}」${s.note||'暂无整理章节'}</div></div>`;
    showScreen('chapter');
    return;
  }
  stack = ['subject', key];
  setBar(s.name, true);
  renderChapters(key, s);
  showScreen('chapter');
}
function renderChapters(key, s){
  let html = `<div class="sec-head">${s.name} · 已整理章节</div>`;
  if(!s.chapters.length){
    html = `<div class="empty"><div class="big">📭</div><div>「${s.name}」${s.note||'暂无内容'}</div></div>`;
  }
  s.chapters.forEach(ch=>{
    let chips = ch.tags.map(tg=>`<span class="chip ${tg.m?'must':''}">${tg.t}</span>`).join('');
    html += `<div class="chapter" onclick="openChapter('${key}','${ch.id}')">
      <div style="display:flex;align-items:center">
        <div style="flex:1">
          <div class="nm">${ch.name}</div>
          <div class="meta">考查分值 ${ch.score} · 题型 ${ch.type}</div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="chips">${chips}</div>
    </div>`;
  });
  document.getElementById('chapterList').innerHTML = html;
}
function openChapter(key, chid){
  const ch = DATA[key].chapters.find(c=>c.id===chid);
  if(!ch) return;
  stack = ['subject', key, chid];
  setBar(ch.name, true);
  renderContent(ch);
  showScreen('content');
}
function renderContent(ch){
  let html = `<div class="c-title">${ch.name} · 重点（点击小章节展开）</div>`;
  let idx=0;
  ch.content.forEach(sec=>{
    idx++;
    const openAttr = idx===1 ? ' open' : '';
    const lvMap = {must:'必会·核心', imp:'必会', know:'了解'};
    const lvCls = sec.level==='must'?'must':(sec.level==='imp'?'imp':'know');
    let body = `<div class="sub-inner">
      <ul>`+ sec.items.map(i=>`<li>${i}</li>`).join('') +`</ul>`;
    if(sec.teach) body += `<div class="teach">${sec.teach}</div>`;
    if(sec.warn) body += `<div class="warn">${sec.warn}</div>`;
    if(sec.q) body += `<div class="q">📝${sec.q.text}<span class="ans">${sec.q.ans}</span></div>`;
    if(sec.table){
      body += `<table><tr>`+sec.table.head.map(h=>`<th>${h}</th>`).join('')+`</tr>`;
      sec.table.rows.forEach(r=>{ body += `<tr>`+r.map(c=>`<td>${c}</td>`).join('')+`</tr>`; });
      body += `</table>`;
    }
    body += `</div>`;
    html += `<details class="sub"${openAttr}>`+
      `<summary>${sec.star?'<span class="star-ico">★</span>':''}${sec.t}`+
      `<span class="lv ${lvCls}">${lvMap[sec.level]||'了解'}</span></summary>${body}</details>`;
  });
  document.getElementById('contentBox').innerHTML = html;
}
function goBack(){
  if(stack.length===0) return;
  stack.pop();
  if(stack.length===0){
    setBar('CPA 备考助手', false); showScreen('subject');
  } else if(stack.length===1){
    openSubject(stack[0]);
  } else if(stack.length===2){
    openSubject(stack[1]);
  }
}
