   opts:["A 法律优位原则","B 税收法定原则","C 新法优于旧法原则","D 实体从旧程序从新原则"],
   ans:"B",exp:"基本原则4项:法定/公平/实质课税/效率。法律优位、新法优于旧法、实体从旧程序从新属适用原则。"},
 e5:{type:"多项选择",q:"下列各项中，属于税法适用原则的有（ ）。",
   opts:["A 特别法优于普通法","B 程序优于实体","C 国内法优于国际法","D 法律优位"],
   ans:"ABD",exp:"适用原则6项:法律优位/特别法优于普通/新法优于旧法/不溯及/实体从旧程序从新/程序优于实体。C错:我国是'国际法优于国内法'。"},
 e7:{type:"单项选择题",q:"(2023)区分一种税与另一种税的重要标志是（ ）。",
   opts:["A 纳税义务人","B 税率","C 征税对象","D 税目"],
   ans:"C",exp:"征税对象是区分税种的重要标志;税目体现广度;税率衡量轻重。"},
 e9:{type:"单项选择题",q:"尚未统一立法的地方税收，经国务院授权可制定实施办法的是（ ）。",
   opts:["A 乡级政府","B 县级政府","C 市级政府","D 省级政府"],
   ans:"D",exp:"中央集权,授权最多下放到省级人民政府,不能到市/县/乡。"},
 e10:{type:"多项选择",q:"(2024)以税收法律形式颁布实施的税种有（ ）。",
   opts:["A 企业所得税","B 车船税","C 印花税","D 消费税"],
   ans:"ABC",exp:"消费税尚未立法,仍以《消费税暂行条例》(授权立法)。口诀小土房没法住:消费税/土地增值税/城镇土地使用税/房产税。"},
 e11:{type:"多项选择",q:"下列属于税收立法程序主要阶段的有（ ）。",
   opts:["A 提议阶段","B 审议阶段","C 通过阶段","D 公布阶段"],
   ans:"ABCD",exp:"立法程序=提议→审议→通过→公布。行政法规由国务院公布,法律由全国人大公布。"},
 e12:{type:"多项选择",q:"下列各项中，属于税收程序法的是（ ）。",
   opts:["A 企业所得税法","B 个人所得税法","C 税收征收管理法","D 关税法"],
   ans:"CD",exp:"程序法规定怎么征税:《税收征管法》管税务机关征纳,《关税法》管海关征纳。AB属实体法。"},
 e15:{type:"单项选择题",q:"关于税收收入划分表述正确的是（ ）。",
   opts:["A 增值税属于中央固定收入","B 车辆购置税属于地方固定收入","C 证券交易印花税属于中央固定收入","D 车船税属于中央固定收入"],
   ans:"C",exp:"A错:增值税是共享税(五五开,海关代征归中央);B错:车购税是中央(车同轨);C对:印花税证券交易归中央,其余归地方;D错:车船税是地方(污染当地)。排除法:中央3类(高大上/车同轨/国门),地方2类(不动+污染)。"},
 e18:{type:"单项选择题",q:"(2020)机构制定纳税计划并提供纳税方案，属于涉税专业服务中的（ ）。",
   opts:["A 税收策划","B 涉税鉴证","C 纳税情况审查","D 纳税申报代理"],
   ans:"A",exp:"'制定纳税计划与方案'符合税收策划(原税务筹划);鉴证=出报告;审查=受托代表政府;申报代理=代报税。"}
};
const LVLBL={must:"必会·核心",imp:"重要",know:"了解"};

/* ================= 渲染 ================= */
function gbOf(gr){
 const hasMust=gr.cards.some(c=>c.lv==='must');
 const hasImp=gr.cards.some(c=>c.lv==='imp');
 if(hasMust)return '<span class="gb gb-must">含必考</span>';
 if(hasImp)return '<span class="gb gb-imp">含重要</span>';
 return '';
}
function render(){
 const grid=document.getElementById('grid');
 let html='';
 GROUPS.forEach(gr=>{
  html+=`<div class="col"><div class="group-head" style="--g:${gr.g};--g2:${gr.g2}"><span class="gt">${gr.name}${gbOf(gr)}</span><span class="arrow">▾</span></div><div class="gc">`;
  gr.cards.forEach(c=>{
   html+=`<div class="card c-${c.lv} ${c.lv}" data-id="${c.id}">
    <div class="tt"><span class="lv ${c.lv}">${LVLBL[c.lv]}</span>${c.t}${c.exam?'<span class="em">📝</span>':''}</div>
    <ul>`;
   c.subs.forEach(sb=>{
    html+=`<li><b>${sb.t}</b>${sb.ex?' <span style="color:#64748b">· '+sb.ex+'</span>':''}`;
    if(sb.kids) sb.kids.forEach(k=>html+=`<span class="sub">· ${k}</span>`);
    html+=`</li>`;
   });
   html+=`</ul>`;
   if(c.kj)html+=`<div class="kj">${c.kj}</div>`;
   if(c.note)html+=`<div class="note">${c.note}</div>`;
   html+=`</div>`;
  });
  html+=`</div></div>`;
 });
 grid.innerHTML=html;
 document.querySelectorAll('.group-head').forEach(gh=>{
  gh.onclick=()=>gh.parentElement.classList.toggle('collapsed');
 });
 document.querySelectorAll('.card').forEach(el=>{
  el.addEventListener('click',()=>{
   const id=+el.getAttribute('data-id');
   const card=GROUPS.flatMap(g=>g.cards).find(c=>c.id===id);
   if(card)openModal(card);
  });
 });
}

/* ================= 详情/例题弹层 ================= */
const emask=document.getElementById('emask'),emodal=document.getElementById('emodal'),
      etype=document.getElementById('etype'),et=document.getElementById('et'),eb=document.getElementById('eb');
function openModal(c){
 etype.textContent=c.exam?EXAM[c.exam].type:"要点";
 et.textContent=c.t;
 let h='<div class="sec">知识点要点</div><ul>';
 c.subs.forEach(sb=>{
  h+=`<li><b>${sb.t}</b>${sb.ex?' · '+sb.ex:''}${sb.kids?'：'+sb.kids.join(' / '):''}</li>`;
 });
 h+='</ul>';
 if(c.kj)h+=`<div class="kj">${c.kj}</div>`;
 if(c.note)h+=`<div class="note">${c.note}</div>`;
 if(c.exam&&EXAM[c.exam]){
  const e=EXAM[c.exam];
  h+=`<div class="examwrap"><div class="sec">📝 例题</div><div class="eq">${e.q}</div>`;
  e.opts.forEach(o=>h+=`<div class="opt">${o}</div>`);
  h+=`<button class="ansbtn" id="ansbtn">查看答案和解析</button>
  <div class="ansbox" id="ansbox"><div class="at">答案：${e.ans}</div><div class="ax"><b>解析：</b>${e.exp}</div></div></div>`;
 }
 eb.innerHTML=h;
 emask.classList.add('show');emodal.classList.add('show');
 const btn=document.getElementById('ansbtn');
 if(btn)btn.onclick=()=>{document.getElementById('ansbox').classList.add('show');btn.style.display='none';};
}
document.getElementById('ec').onclick=()=>{emask.classList.remove('show');emodal.classList.remove('show');};
emask.onclick=()=>{emask.classList.remove('show');emodal.classList.remove('show');};

render();
</script>
</body>
</html>
